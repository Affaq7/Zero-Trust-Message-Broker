[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-broker-testbed"
version = "0.1.0"
description = "Testbed for a Zero Trust Message Broker for Agentic AI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# LLM agent frameworks. Exact versions: constraints.txt (CrewAI pins pydantic 2.12.x).
agents = [
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "crewai>=1.15",
]

[tool.setuptools.packages.find]
include = ["contracts*", "wrapper*", "agents*", "runner*", "mocks*", "broker*"]

[tool.setuptools.package-data]
contracts = ["*.yaml"]
mocks = ["fixtures/files/*/*", "fixtures/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ollama: needs a running Ollama; skipped unless RUN_OLLAMA_TESTS=1"]

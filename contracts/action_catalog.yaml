# Action catalog, contract v0.2. The only place actions are defined.
#
# Default-deny: any action not listed here is denied, for every role.
# allowed_roles = the roles that may CALL the action.
# served_by     = the agent that EXECUTES it. PROVISIONAL, see
#                 docs/open-questions.md Q1 (owner to confirm).
# agents / roles lists are PROVISIONAL, see Q2.
#
# The catalog is enforced by the broker only. Direct mode ignores it.

schema_version: "0.2"

roles: [planner, research, database, tool, mailer]
agents: [planner, research, database, tool, mailer, malicious]

actions:
  - name: db.query_aggregate
    class: Permitted
    allowed_roles: [planner, research]
    served_by: database

  - name: db.query_rows
    class: Conditional
    allowed_roles: [planner]
    served_by: database

  - name: db.update_records
    class: Conditional
    allowed_roles: [planner]
    served_by: database

  - name: file.read_internal
    class: Permitted
    allowed_roles: [planner, research]
    served_by: tool

  - name: file.delete
    class: Conditional
    allowed_roles: [planner]   # PROVISIONAL (Q11): was [tool]
    served_by: tool

  - name: web.fetch_page
    class: Permitted
    allowed_roles: [research]
    served_by: tool

  - name: tool.send_email_internal
    class: Permitted
    allowed_roles: [planner]   # PROVISIONAL (Q11): was [planner, tool]
    served_by: tool

  - name: tool.send_email_external
    class: Conditional
    allowed_roles: [planner]   # PROVISIONAL (Q11): was [tool]
    served_by: tool

  # Added with the same schema_version "0.2" (additive; S10-S12, agreed by
  # Kissa and Amna). The catalog has no field for resources or risk ratings:
  # resource names are documented in docs/open-questions.md, ratings too.
  - name: research.lookup        # resource research:query
    class: Permitted
    allowed_roles: [planner]
    served_by: research

  - name: planner.request        # resource planner:request
    class: Permitted
    allowed_roles: [research]
    served_by: planner

  - name: mail.deliver           # resource mail:outbound
    class: Permitted
    allowed_roles: [tool]
    served_by: mailer

  - name: admin.change_policy
    class: Prohibited
    allowed_roles: []
    served_by: null   # nobody may call it, so nobody serves it
